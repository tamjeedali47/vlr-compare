# Local stack: the web app plus Postgres.
#
#   docker compose up --build     # whole stack at http://localhost:3000
#   docker compose up -d db       # just the database, for `npm run dev`
#   docker compose down           # stop (data is kept in the volume)
#   docker compose down -v        # stop and delete the database volume
#
# Credentials below are local-development defaults; override them in a .env
# file next to this one (see .env.example). In AWS they come from Secrets
# Manager instead.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vlr}
      POSTGRES_DB: ${POSTGRES_DB:-vlr}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      # "db" resolves to the database container on Compose's network.
      DATABASE_URL: postgres://${POSTGRES_USER:-vlr}:${POSTGRES_PASSWORD:-vlr}@db:5432/${POSTGRES_DB:-vlr}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
